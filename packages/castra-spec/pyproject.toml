[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castra-spec"
version = "1.0.0"
description = "Challenge authoring SDK and manifest schema for the Castra platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
authors = [{ name = "Castra maintainers" }]
keywords = ["ctf", "challenge", "manifest", "blueteam"]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
castra = "castra_spec.cli:main"

[project.entry-points."castra.validators"]
exact = "castra_spec.builtin.exact:ExactValidator"
regex = "castra_spec.builtin.regex:RegexValidator"
multi_part = "castra_spec.builtin.multi_part:MultiPartValidator"

[project.urls]
Homepage = "https://castra.sh"
Repository = "https://github.com/uspdan/castra"

[project.optional-dependencies]
# ReDoS-hardened regex engine, as used by the platform. Optional for
# authors: `castra` falls back to stdlib re (with a logged warning) so
# authoring works on platforms without a google-re2 wheel.
re2 = ["google-re2>=1.1"]
testing = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
castra_spec = ["schemas/*.json"]
