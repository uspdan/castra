name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a branch is pushed twice in quick
# succession — the older run's signal is no longer load-bearing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI test secrets — never used in real environments. Generated
# per-job via openssl in the "ci-env" step so the workflow file
# itself doesn't carry secret-shaped strings (R15 audit finding).
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: backend — full test suite + coverage gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siege
          POSTGRES_PASSWORD: siege_secret
          POSTGRES_DB: siege_range_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siege"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: generate ephemeral CI test secret
        run: |
          # Match Settings.SECRET_KEY min_length=32 — generate per-job.
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: run full test suite (unit + integration) with coverage gate
        working-directory: backend
        env:
          APP_ENV: test
          ADMIN_PASSWORD: CIAdminPasswordA1!
          ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: postgresql+asyncpg://siege:siege_secret@localhost:5432/siege_range_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Combined unit + integration run so the project-wide
          # 80% coverage gate from pytest.ini sees the full call
          # graph. Running them separately under the same gate
          # double-counts shared modules without covering the
          # ones only one tier exercises.
          python -m pytest tests/ -v

      # The in-repo SDK ships its own suite (manifest validation, flag
      # types, the validator contract, and a parity check between the
      # Pydantic model and the frozen JSON Schema). None of it ran in
      # CI, because the step above is scoped to backend/tests. The
      # schema-parity test had been failing since the pydantic 2.6→2.13
      # bump — newer pydantic stopped emitting "type" alongside "const"
      # — and nothing noticed for weeks.
      - name: run the castra-spec package suite
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m pytest ../packages/castra-spec/tests -v --no-cov

  frontend-build:
    name: frontend — vite build + lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install (npm ci — exact lockfile)
        working-directory: frontend
        run: npm ci

      # Was ``npm run lint --if-present``, which did nothing: there was
      # no lint script and no config, so the job reported "vite build +
      # lint" while linting exactly zero files. No --if-present now —
      # if the script disappears again, this fails loudly.
      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

  backend-static:
    name: backend — ruff + mypy
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      # CLAUDE.md §6.1 mandates a zero-warning linter and strict type
      # checking. Neither has ever run in CI: ``make lint`` invoked a
      # ruff that was installed nowhere, and no type checker existed.
      - name: ruff
        working-directory: backend
        run: ruff check app/ tests/

      # Config in pyproject.toml checks all of app/ with the currently
      # unclean modules listed as explicit exceptions, so new code is
      # type-checked from the day it lands. mypy found a real bug on
      # first run: stdlib logger calls passing structlog-style kwargs,
      # which raise TypeError at emit time.
      - name: mypy
        working-directory: backend
        run: mypy

  python-deps-audit:
    name: deps-audit — pip-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install pip-audit
        run: pip install pip-audit

      - name: audit backend requirements
        # R13 / R14: fail on HIGH or CRITICAL findings. The
        # editable ``../packages/castra-spec`` line in
        # requirements-test.txt resolves relative to backend/, so
        # cd in first.
        #
        # Documented suppressions — re-audit each release:
        #
        # * CVE-2025-71176 (pytest) — dev-only, major bump with
        #   plugin breakages. Tracked. OSV now reports this as
        #   PYSEC-2026-1845; pip-audit resolves the alias.
        # * CVE-2025-69872 (diskcache) — no upstream fix. Reaches us
        #   transitively via pySigma, for a rule cache backed by
        #   backends this project does not use.
        #
        # Closed by the dependency refresh, suppressions removed:
        # * PYSEC-2026-161 (starlette) — was held open by
        #   "fastapi 0.123 pins starlette<0.50". fastapi 0.140 lifted
        #   the cap and we now run starlette 1.3.1.
        # * CVE-2026-0994 (protobuf) — was held open by
        #   "opentelemetry-proto 1.27 pins protobuf<5". OTel is now
        #   1.44 and protobuf resolves well past the fix.
        #
        # R28 (PyJWT migration) closed:
        # * PYSEC-2025-185 (python-jose) — dep removed.
        # * CVE-2024-23342 (ecdsa)       — dep dropped (was
        #                                  transitive via jose).
        # * CVE-2026-30922 (pyasn1)      — dep dropped (was
        #                                  transitive via jose).
        working-directory: backend
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-test.txt \
            --strict \
            --vulnerability-service osv \
            --ignore-vuln CVE-2025-71176 \
            --ignore-vuln CVE-2025-69872

  frontend-deps-audit:
    name: deps-audit — npm audit
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      # ``npm audit`` cannot currently be used as a gate at all:
      #   * npm 10.x (bundled with Node 20) queries
      #     ``/-/npm/v1/security/audits/quick``, which the registry has
      #     retired — it answers 400 for every package tree.
      #   * npm 11.x queries the replacement bulk endpoint, which
      #     returns a gzip-compressed body with no ``Content-Encoding``
      #     header, so the client fails to parse it. Reproduced on
      #     11.0.0, 11.9.0 and 11.18.0, locally and on the runner.
      # Either way the job failed without ever reporting a
      # vulnerability, which is worse than a false positive: a gate
      # that is red for infrastructure reasons teaches people to
      # ignore it.
      #
      # osv-scanner reads package-lock.json directly and queries OSV —
      # the same vulnerability service the pip-audit job already uses,
      # so both ecosystems now gate on one data source. Pinned by
      # version *and* checksum per CLAUDE.md §11.1.
      - name: fetch osv-scanner
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  /tmp/osv-scanner" \
            | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: npm dependency audit (high+ severity)
        working-directory: frontend
        run: |
          set -euo pipefail
          # osv-scanner exits non-zero for findings of any severity;
          # the gate below decides what actually blocks. Suppressions
          # live in frontend/osv-scanner.toml, each with a reason.
          /tmp/osv-scanner scan source \
            --lockfile=package-lock.json \
            --format json > osv-report.json || true
          python3 - osv-report.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          blocking = []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  name = pkg["package"]["name"]
                  version = pkg["package"]["version"]
                  for vuln in pkg.get("vulnerabilities", []):
                      severity = (vuln.get("database_specific") or {}).get(
                          "severity", "UNKNOWN"
                      )
                      if severity in ("HIGH", "CRITICAL"):
                          summary = (vuln.get("summary") or "").strip()
                          blocking.append(
                              f"{severity}  {name}@{version}  {vuln['id']}  {summary}"
                          )
          if blocking:
              print(
                  f"::error::{len(blocking)} HIGH/CRITICAL advisories in the "
                  "npm dependency tree"
              )
              for line in blocking:
                  print(f"  {line}")
              sys.exit(1)
          print("no HIGH/CRITICAL advisories in the npm dependency tree")
          PY

  alert-rules:
    name: alert-rules — promtool validate + unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Pinned by version and digest, matching the prometheus service in
      # docker-compose.yml — CI must validate the rules with the same
      # binary that will evaluate them.
      - name: promtool — syntax check
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/docs/alerts:/alerts:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            check rules /alerts/api.rules.yml /alerts/audit.rules.yml /alerts/backup.rules.yml

      # A rule file that parses is not a rule file that fires. These
      # evaluate each expression against synthetic series and assert the
      # alert trips at the right threshold — the backup rules exist
      # because a job failed silently for days, so "it loaded" is not a
      # standard worth trusting.
      - name: promtool — rule unit tests
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/docs/alerts:/alerts:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            test rules /alerts/tests/backup_test.yml /alerts/tests/api_test.yml /alerts/tests/audit_test.yml

      - name: amtool — routing config check
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/infra/observability:/cfg:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            check-config /cfg/alertmanager.yml

  secret-scan:
    name: secret-scan — trufflehog
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: trufflehog (verified-only)
        uses: trufflesecurity/trufflehog@v3.81.10
        with:
          path: ./
          # Only verified secrets fail the build. Heuristic-only hits
          # become PR comments via the action's default behaviour.
          extra_args: --only-verified

  flag-leak-check:
    name: flag-leak — refuse cleartext CTF flags in tracked source
    runs-on: ubuntu-22.04
    timeout-minutes: 2

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: scan tracked files for ``CTF{...}`` literals
        run: |
          set -eu
          # Permit the redacted marker and the explicit template
          # placeholder. Anything else means cleartext flag back in
          # the tree — fail the build.
          # examples/ ships intentionally-leaky training artefacts
          # (pre-rendered memory dumps, sample evtx, etc.) for the
          # challenge-author tutorial. Out of scope for this gate —
          # tracked in docs/author-onboarding.md as a follow-up.
          if git grep -nE 'CTF\{[^}]+\}' \
              -- ':!*.flag.txt' ':!examples/' ':!docs/' \
                 ':!.claude/' \
                 ':!.github/workflows/ci.yml' \
              | grep -v 'CTF{REDACTED}' \
              | grep -v 'CTF{{REDACTED}}' \
              | grep -v 'CTF{EXAMPLE_flag_string}' \
              | grep -v 'CTF{<' ; then
            echo
            echo "::error::Cleartext CTF flag literal detected in tracked source."
            echo "::error::Flags must live under secrets/ and be staged via scripts/stage-answers.sh"
            exit 1
          fi
          echo "no cleartext CTF{...} literals in tracked source — ok"

  egg-info-check:
    name: egg-info — refuse tracked build artefacts
    runs-on: ubuntu-22.04
    timeout-minutes: 2

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: ensure backend/siege_backend.egg-info is not tracked
        # R31 audit finding — a previous packaging step had committed
        # the egg-info directory despite it being gitignored. Catch
        # any future regression in CI.
        run: |
          set -eu
          if git ls-files backend/siege_backend.egg-info | grep -q .; then
            echo "::error::backend/siege_backend.egg-info is tracked — it should be gitignored."
            git ls-files backend/siege_backend.egg-info
            exit 1
          fi
          echo "no tracked egg-info — ok"
