# osv-scanner configuration for the frontend dependency gate.
#
# The CI job fails on any HIGH or CRITICAL finding against
# package-lock.json. Entries here suppress a specific advisory and must
# carry a reason explaining why it is not reachable in this deployment.
# Anything that is merely inconvenient to fix does NOT belong here.

[[IgnoredVulns]]
id = "GHSA-fx2h-pf6j-xcff"
# vite: `server.fs.deny` bypass via Windows alternate data streams /
# 8.3 filenames, letting the dev server return denied file contents.
#
# Not reachable here on two independent counts:
#   1. Windows-only. The advisory's own impact section limits it to
#      Windows hosts; every environment that runs this dev server is
#      Linux (the `dashboard` service in docker-compose.dev.yml).
#   2. It affects the Vite *dev server*, which is never part of a
#      production deployment — `docker-compose.prod.yml` builds the
#      frontend with `target: production`, serving a static bundle
#      through nginx with no Vite process running.
#
# There is no fix in the 5.x line: the advisory is first patched in
# 6.4.3. Clearing it therefore means a Vite major upgrade (5 -> 6+)
# together with @vitejs/plugin-react and @tailwindcss/vite, which is a
# build-toolchain change that deserves its own PR and its own build
# verification rather than riding along with a security patch set.
reason = "Windows-only dev-server issue; deployment is Linux and prod serves a static bundle. No 5.x fix — needs a Vite major upgrade, tracked separately."
