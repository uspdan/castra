# Prometheus config for the opt-in monitoring overlay
# (docker-compose.monitoring.yml). Mirrors the scrape entry and
# rule_files layout documented in docs/alerts/README.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/api.rules.yml
  - /etc/prometheus/rules/audit.rules.yml

scrape_configs:
  - job_name: siege-range-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          service: siege-range
          env: production
