# Phase 8: backend is now a packaged project so the built-in
# validators in `app/validators/` can register under the
# `castra.validators` entry-point group — the same mechanism
# external plugin authors use. The package isn't published anywhere;
# it's installed editable into the runtime image (Dockerfile) and the
# host test venv (requirements-test.txt) purely so importlib.metadata
# can enumerate the entry points.
#
# Runtime dependencies remain in requirements.txt — keeping them out
# of [project.dependencies] preserves the existing pinning workflow
# and avoids rewriting the install path for one phase's needs.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siege-backend"
version = "0.0.0"
description = "seige-range FastAPI application (internal package, not published)."
requires-python = ">=3.10"
license = { text = "MIT" }

# Baseline validators (exact, regex, multi_part) are registered by the
# castra-spec package itself — the SDK must work standalone, and the
# registry treats duplicate names as an error, so they must not be
# re-registered here. This group carries only the platform-side
# validators with heavy dependencies (pysigma, yara-python, clamav).
[project.entry-points."castra.validators"]
# Phase 10 — blue-team validators. Each maps a manifest flag.type
# string to its implementation class.
sigma_rule = "app.validators.sigma_rule:SigmaRuleValidator"
yara_rule = "app.validators.yara_rule:YaraRuleValidator"
chain_of_custody = "app.validators.chain_of_custody:ChainOfCustodyValidator"
attack_chain = "app.validators.attack_chain:AttackChainValidator"
cloud_misconfig = "app.validators.cloud_misconfig:CloudMisconfigValidator"
# Sprint 9 Phase C — AI/LLM honeypot (ADR 0001).
llm_signal = "app.validators.llm_signal:LlmSignalValidator"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*"]

# ---------------------------------------------------------------------------
# Ruff. CLAUDE.md §6.1 mandates a zero-warning linter; until now the
# `make lint` target invoked a ruff that was installed nowhere and CI ran
# no Python linter at all, so this is the first configuration that has
# ever actually been enforced.
#
# The rule set is deliberately ruff's default (E4/E7/E9 + F) rather than
# everything-on. Turning on the full catalogue against a codebase this
# size produces hundreds of findings, and a gate that lands red is a gate
# people learn to bypass. Expanding the selection is follow-up work with
# its own review; this establishes the floor and makes it real.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-test", "migrations/versions"]

[tool.ruff.lint]
# E4 import formatting, E7 statement issues, E9 syntax/IO errors, F pyflakes.
select = ["E4", "E7", "E9", "F"]

ignore = [
    # E712 flags ``Column == True`` and suggests ``if Column:``. That
    # advice is actively wrong for SQLAlchemy: the comparison builds a
    # SQL expression, while truthiness evaluates the Column object in
    # Python and silently drops the filter. Newer code here uses the
    # correct ``.is_(True)`` idiom; migrating the ~30 remaining call
    # sites is a query-semantics change that belongs in its own PR, not
    # smuggled in behind a lint config.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# Package entrypoints re-export their module's public API (CLAUDE.md
# §1.1). Those imports are "unused" only in the sense that nothing in
# the file itself consumes them.
"__init__.py" = ["F401"]
"app/services/webhook_dispatch/__init__.py" = ["F401"]

# Deliberate late imports. ``main.py`` wires OpenTelemetry after the
# engine and app object exist — instrumentation cannot run before its
# targets are constructed. ``routers/v1/auth.py`` and ``routers/health.py``
# import inside module scope to avoid import cycles.
"app/main.py" = ["E402"]
"app/routers/v1/auth.py" = ["E402"]
"app/routers/health.py" = ["E402"]

# conftest annotates fixtures with string forward-references
# ("AsyncSession", "aioredis.Redis") whose modules are imported lazily
# inside each fixture body. That is load-bearing, not sloppiness: the
# testcontainer URLs must be in the environment before app.* is
# imported, or app/database.py binds its engine to the compose default
# and every later test fails DNS resolution. Importing these at module
# scope to satisfy F821 would reintroduce exactly that bug.
"tests/conftest.py" = ["F821", "E402"]

# ---------------------------------------------------------------------------
# mypy. CLAUDE.md §6.1 asks for strict type checking; nothing has ever run
# a type checker against this codebase, and a cold `mypy app/` reports 318
# errors across 39 modules — the bulk of them SQLAlchemy `Column[int]` vs
# `int` friction that needs `Mapped[...]` annotations on the models.
#
# Rather than ship another gate that cannot go green, this checks
# everything by default and lists the currently-unclean modules as
# explicit exceptions. The polarity matters: a NEW module is type-checked
# from the day it lands, and clearing an entry below is a one-line diff.
# Nobody has to boil the ocean to keep the ratchet turning.
#
# 105 of 144 modules are already covered, including every security-
# relevant one — rate_limit, security_headers, syscall_filter, auth,
# validator_sandbox, seccomp.
#
# This is deliberately not `--strict` yet. Getting the ignore list below
# to empty comes first; tightening the setting is the step after.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_configs = true
# Surfaces an ignore entry that is no longer needed, so the list below
# shrinks as a side effect of unrelated cleanups instead of rotting.
warn_unused_ignores = true

# ── Not yet type-clean ─────────────────────────────────────────────────
# Delete an entry once `mypy` passes for it. Do not add to this list
# without a reason in the PR description.
[[tool.mypy.overrides]]
module = "app.config"
ignore_errors = true

